# Forgejo — personal single-user forge.
# Pinned to the 15.x LTS line (supported to 2027-07) rather than latest stable,
# so an unattended personal box is not forced into a major upgrade every ~4 months.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: ${FORGE_CONTAINER:-forgejo}
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      # APP_NAME can't be set via FORGEJO__DEFAULT__APP_NAME (Gitea's env-to-ini
      # writes it into a literal [default] section, not the real top-level
      # section Gitea reads) — it's patched directly into app.ini instead,
      # which persists in the data volume/B2 backups across restarts.

      # --- how it is reached -------------------------------------------------
      # ROOT_URL is the *public* name, because that is where you browse from.
      # Git over Tailscale works regardless of this value.
      FORGEJO__server__ROOT_URL: ${FORGE_ROOT_URL}
      FORGEJO__server__DOMAIN: ${FORGE_DOMAIN}
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__HTTP_ADDR: 0.0.0.0
      FORGEJO__server__HTTP_PORT: 3000
      # No built-in SSH server: everything goes over HTTPS, which both the
      # Tailscale and Cloudflare paths already terminate for us.
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__DISABLE_SSH: "true"

      # Trust the local docker bridge, loopback, and the Tailscale CGNAT range
      # so X-Forwarded-For is honoured and logs show the real client.
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 127.0.0.0/8,172.16.0.0/12,100.64.0.0/10
      FORGEJO__security__INSTALL_LOCK: "true"

      # --- it is only ever me ------------------------------------------------
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__ENABLE_NOTIFY_MAIL: "false"
      FORGEJO__session__COOKIE_SECURE: ${FORGE_COOKIE_SECURE:-true}

      # --- lean UI: code, browse, releases. nothing else ---------------------
      FORGEJO__repository__DEFAULT_REPO_UNITS: repo.code,repo.releases
      FORGEJO__repository__DISABLED_REPO_UNITS: repo.issues,repo.pulls,repo.wiki,repo.projects,repo.packages
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__packages__ENABLED: "false"
      FORGEJO__mirror__ENABLED: "false"
      FORGEJO__other__SHOW_FOOTER_VERSION: "false"
      FORGEJO__other__SHOW_FOOTER_TEMPLATE_LOAD_TIME: "false"

      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/forgejo.db
      FORGEJO__log__LEVEL: Info

      # Webhooks default to blocking loopback/private targets (SSRF guard).
      # host.docker.internal is where the push-listener runs, so allow it.
      FORGEJO__webhook__ALLOWED_HOST_LIST: host.docker.internal

    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Loopback ONLY. Never 0.0.0.0 — the internet must reach this solely via
      # Tailscale, never via the Oracle instance's public IP.
      - "127.0.0.1:${FORGE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
